# ⚠️ WARNING: PLACEHOLDERS ONLY — Configure via kubectl antes do deploy
# Nenhum valor real é armazenado no repositório.
#
# MONGO_CONN_MAP: JSON com mapa PIN → URI do MongoDB Atlas
#   Exemplo: {"1234":"mongodb+srv://user:pass@cluster.mongodb.net/db?retryWrites=true&w=majority"}
#   Cada família/usuário tem um PIN único e seu próprio banco.
#
# VAPID keys: gerar com o comando abaixo (uma vez, guardar os valores):
#   npx web-push generate-vapid-keys
#
# Para configurar o secret real no cluster:
#   kubectl create secret generic financial-app-secret \
#     -n financial \
#     --from-literal=MONGO_CONN_MAP='{"PIN":"mongodb+srv://..."}' \
#     --from-literal=VAPID_PUBLIC_KEY="B..." \
#     --from-literal=VAPID_PRIVATE_KEY="y..." \
#     --dry-run=client -o yaml | kubectl apply -f -

apiVersion: v1
kind: Secret
metadata:
  name: financial-app-secret
  namespace: financial
  labels:
    app: financial-app
    managed-by: kustomize
    project: devops-lab
    challenge: "11"
type: Opaque
stringData:
  MONGO_CONN_MAP: '{"CONFIGURE_PIN":"mongodb+srv://CONFIGURE_USER:CONFIGURE_PASS@CONFIGURE_CLUSTER.mongodb.net/CONFIGURE_DB?retryWrites=true&w=majority"}'
  VAPID_PUBLIC_KEY: "CONFIGURE_VIA_npx_web-push_generate-vapid-keys"
  VAPID_PRIVATE_KEY: "CONFIGURE_VIA_npx_web-push_generate-vapid-keys"
